<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b3a5c" />

    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />

    <title>Manpower Global Agency SRL — Work Visa, Study Visa &amp; Global Opportunities</title>
    <meta
      name="description"
      content="Expert work visa, study visa and immigration guidance for Romania, the EU and worldwide. 15+ years, 50,000+ clients, 98% approval rate."
    />

    <!--
      Static fallbacks. react-helmet-async sets per-route tags at runtime, which
      Google renders, but Facebook / LinkedIn / WhatsApp link scrapers do NOT run
      JavaScript. These give every shared link a correct preview.
      __SITE_URL__ is replaced at build time by scripts/generate-sitemap.mjs.
    -->
    <meta property="og:site_name" content="Manpower Global Agency SRL" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta
      property="og:title"
      content="Manpower Global Agency SRL — Work Visa, Study Visa &amp; Global Opportunities"
    />
    <meta
      property="og:description"
      content="Expert work visa, study visa and immigration guidance for Romania, the EU and worldwide. 15+ years, 50,000+ clients, 98% approval rate."
    />
    <meta property="og:image" content="__SITE_URL__/logo.jpg" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SITE_URL__/logo.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem; text-align: center">
        This site needs JavaScript. Please enable it, or contact us directly at
        <a href="mailto:info.fiaeurope@gmail.com">info.fiaeurope@gmail.com</a> or +40 734 304 768.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
